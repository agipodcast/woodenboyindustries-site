<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facilitator view: Gemini for K-8 Educators</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#08070B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
  <style>
    :root {
      --gold: #F5B819; --vanta: #08070B; --ink: #14110E; --walnut: #6B4A2E; --bark: #2E2114;
      --parchment: #F7F1E4; --cream: #FDFAF2; --stone: #4A4238; --border: #DDD2BF; --gold-tint: #FBF1D8;
      --mono: 'JetBrains Mono', Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', Arial, Helvetica, sans-serif; font-size: 16px;
      color: var(--bark); background: var(--parchment);
      display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      padding: 0.55rem 1rem; color: var(--parchment); background: var(--vanta);
      border-bottom: 3px solid var(--gold);
    }
    header .title { font-weight: 800; }
    header .title .kicker { font-family: var(--mono); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-right: 0.5rem; }
    header .spacer { flex: 1; }
    header button, header a.btn {
      background: none; border: 1px solid rgba(247, 241, 228, 0.35); color: var(--parchment);
      font: inherit; font-size: 0.875rem; padding: 0.3rem 0.8rem; border-radius: 6px;
      cursor: pointer; text-decoration: none;
    }
    header button:hover, header a.btn:hover { background: rgba(245, 184, 25, 0.2); }
    header .counter { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 5.5rem; text-align: center; }
    header .mstone { font-size: 0.8125rem; opacity: 0.85; }
    header .goto { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8125rem; }
    header .goto input {
      width: 4.25rem; font: inherit; font-size: 0.9375rem; font-weight: 600; text-align: center;
      padding: 0.2rem 0.3rem; border-radius: 6px; border: 1px solid rgba(247, 241, 228, 0.45);
      background: rgba(247, 241, 228, 0.12); color: var(--parchment);
    }
    header .goto input:focus { outline: 2px solid var(--gold); background: var(--cream); color: var(--ink); }
    .deck { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .deck .who {
      padding: 0.3rem 0.75rem; font-family: var(--mono); font-size: 0.75rem; font-weight: 600;
      color: var(--walnut); background: var(--cream); border-bottom: 1px solid var(--border);
      text-transform: uppercase; letter-spacing: 0.14em;
    }
    .deck iframe { flex: 1; width: 100%; border: 0; background: var(--parchment); }
    .dragbar {
      flex: 0 0 auto; height: 12px; cursor: row-resize; touch-action: none;
      background: linear-gradient(to bottom, transparent 4px, var(--gold) 4px, var(--gold) 8px, transparent 8px), var(--cream);
    }
    .dragbar:hover, body.resizing .dragbar {
      background: linear-gradient(to bottom, transparent 3px, var(--walnut) 3px, var(--walnut) 9px, transparent 9px), var(--cream);
    }
    body.resizing { user-select: none; }
    body.resizing iframe { pointer-events: none; }
    .notes {
      flex: 0 0 auto; height: 34vh; min-height: 3rem; overflow-y: auto;
      background: var(--cream); padding: 1rem 1.25rem;
    }
    .notes h3 {
      font-family: var(--mono); font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--walnut); margin-bottom: 0.25rem;
    }
    .notes h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 0.6rem; }
    .notes .body { max-width: 62rem; line-height: 1.65; white-space: pre-wrap; }
    .notes .body b { color: var(--ink); }
    .notes .body .clock {
      display: inline-block; font-family: var(--mono); font-size: 0.8125rem; font-weight: 600;
      letter-spacing: 0.06em; color: var(--ink); background: var(--gold-tint);
      border-left: 3px solid var(--gold); padding: 0 0.5rem;
    }
    .notes .none { color: var(--stone); font-style: italic; }
  </style>
</head>

</header>

</div>
<script>
(function () {
  'use strict';
  var PLAN = {"title": "Gemini for K-8 Educators", "slides": 57, "milestones": [{"title": "Start here", "from": 1, "to": 4}, {"title": "Module 1. Meet Gemini", "from": 5, "to": 21}, {"title": "Module 2. Gems", "from": 22, "to": 37}, {"title": "Module 3. Gemini Notebook", "from": 38, "to": 46}, {"title": "Module 4. Classroom-ready assets", "from": 47, "to": 54}, {"title": "Take it home", "from": 55, "to": 57}], "titles": {"1": "Gemini for K-8 Educators", "2": "How today works", "3": "Three questions before every prompt", "4": "Grab your materials", "5": "Meet Gemini", "6": "One name, two things", "7": "Which account are you in?", "8": "Your school account vs. a personal one", "9": "Two-minute access check", "10": "Start cold: one plain request", "11": "CRAFT: five things Gemini can't guess", "12": "Now the full CRAFT prompt", "13": "Pick two or three quick wins", "14": "One passage, three reading levels", "15": "Standards into \"I can\" statements", "16": "Exit ticket questions", "17": "A sub plan", "18": "A hands-on science activity", "19": "Directions for English learners", "20": "A kid-friendly vocabulary list", "21": "The 30-second check", "22": "Gems: set it up once, use it every week", "23": "Chat or a Gem?", "24": "Build a Gem, part 1: open the editor", "25": "Part 2: the instructions", "26": "Part 3: settings, then Save", "27": "Part 4: test it", "28": "Your second Gem: Lesson Plan Co-Planner", "29": "More Gems, if you have time", "30": "Differentiation Helper", "31": "Rubric Builder", "32": "Read-Aloud Discussion Questions", "33": "Accommodation Idea Brainstormer", "34": "Sub Plan Builder", "35": "Classroom Management Script Helper", "36": "Sharing a Gem, and what travels with it", "37": "Take ten", "38": "Gemini Notebook (formerly NotebookLM)", "39": "Chat, Gem, or notebook?", "40": "Get your unit ready", "41": "Create your notebook", "42": "Ask questions your sources can answer", "43": "What happens when the answer isn't there?", "44": "Keep the good answers", "45": "Connect your notebook to a Gem", "46": "You may also see Notebooks inside Gemini", "47": "Make classroom-ready materials", "48": "An Audio Overview for families", "49": "A study guide", "50": "A quiz", "51": "Flashcards", "52": "A mind map", "53": "A slide deck", "54": "Before anything leaves your hands", "55": "Look at what you made", "56": "Try this week", "57": "Take it with you"}, "notes": {"1": "BEFORE THE ROOM FILLS\n1. Open the training page once on your own laptop to confirm it loads. There is nothing to set up: no session, no join code, no sign-in.\n2. Open this facilitator view on your laptop (not the projector) so your notes stay private.\n3. Write the training page's address big on the board.\n4. Project slide 1 from the training page, or just leave the address up.\n\nCLOCK 0:00\nSAY: Open Chrome and type the address on the board. You'll see this title slide. Use the arrows at the top, or your arrow keys, to move. That's the whole interface.\nWATCH: people on district Chromebooks who are not yet signed in. Help them sign in first; everything today assumes their school account.\nIF IT BREAKS: the page is a normal website, so a refresh fixes most things. It remembers the slide they were on.", "2": "CLOCK 0:02\nSAY: Today runs at your speed. I'll talk for a minute or two at the start of each module, and the rest is you, hands on. If you get stuck, raise your hand and read me the number at the top right of your screen. I'll pull up the same slide on my end.\nSAY (the toggles): Every how-to slide has one plain instruction. If you know how, just do it. If not, open \"Show me how\" for the steps and pictures.\nSAY (the why): Some of you will fly and some of you will want to linger on a slide. Both are fine. The only goal is that you leave with things you'll use.\nWATCH: anyone using the Gemini desktop app. It is fine, but for today their screens will match the slides only in Chrome at gemini.google.com (Google has not published whether the desktop app matches the web app feature for feature).\nNOTE: the step-by-step pictures come from a free personal Google account. The toggle says so, and says school screens may look a little different.\nTIP: To jump a teacher to a slide, they can add #23 (or any number) to the end of the address.", "3": "CLOCK 0:04\nSAY: These three questions are the only rules I'll ask you to memorize today. You'll see them in small print above most starter prompts.\nSAY (on question 3): This is the one that catches almost everything. If a parent reading over your shoulder would wince, rewrite it.\nSAY (on the red box): The habit is the same even when your district says its tools are covered. We take identifying details out anyway. It costs nothing and it protects kids.\nWATCH: anyone who says \"but my district approved Gemini.\" Good. That answers question 2. Questions 1 and 3 still apply every time.", "4": "CLOCK 0:06\nSAY: Grab the quick reference card now. The workbook is optional. It's this whole training in one PDF, for anyone who'd rather follow along in a PDF beside the browser than switch between tabs.\nSAY: If you brought your own unit, use it. It will mean more to you than ours. If not, you'll download one of our sample units on slide 40, right where you use it.\nSINCE 2026-09-30: the .zip of all eight sample files is gone from this slide. After the first test group, it caused more confusion than it saved: people who had it didn't know which files to pick, and it needed its own unzip steps. Each unit's files are on slide 40.", "5": "CLOCK 0:08 (Module 1 runs to about 0:43)\nSAY: For the next half hour: sign in the right way, one prompt pattern you can remember, and two or three things you can use tomorrow.\nSAY (the permission): You can't break it. A strange answer just tells you what to ask for next.\nWATCH: the skeptics and the anxious ones. Name it kindly: \"Some of you are here because you were told to be. That's fine. Judge it by what it makes for you in the next half hour.\"", "6": "CLOCK 0:10\nSAY: When people say \"Gemini\" they mean two things. The model is the engine: the AI underneath that reads and writes. The app is the car you drive. Same engine, several cars. Today we drive two of them.\nSAY: Google updates the engine behind the scenes. When your screen looks different from my slides, it's usually because Google moved something on the car's dashboard.\nFACT CHECK: Google describes the Gemini app as an interface to its multimodal models (gemini.google/overview). Gemini in Classroom is free in every Education edition (blog.google, ISTE 2025); we mention it but don't use it today.", "7": "CLOCK 0:12\nSAY: This is the number one privacy mistake: using Gemini in a personal account at school. It looks identical. It is not treated the same. Everybody check your email address right now, out loud if you want.\nWATCH: teachers on personal laptops who are signed into Chrome with a personal Gmail. Walk them through a school Chrome profile. It takes a minute and keeps the two accounts apart from then on.\nUNVERIFIED (checked 2026-09-24): Google's pages disagree on where the account picture sits inside Gemini (left menu vs top right). SEEN WHILE CAPTURING (personal account, 2026-09-27): the picture is at the bottom left corner of Gemini. The slide says so, and gives top right for other Google pages. If neither matches on their screen, the Chrome profile icon at the top right of Chrome also shows the account.\nFACT: Chrome profile steps and the \"keep work and personal separate\" purpose are from support.google.com/chrome/answer/2364824.", "8": "CLOCK 0:15\nSAY: Here's the difference, in plain terms, from Google's own help pages. Google says school chats aren't reviewed by human reviewers or used to improve its generative AI models. Your district can still search them. That's by design.\nSAY: Protection is not permission. This slide is about what Google does with the data. What you're allowed to use it for is still your district's call. And it is not legal advice.\nSOURCES (checked 2026-09-24): Education accounts, support.google.com/gemini/answer/14620100 (Education version). Personal accounts, the Gemini Apps Privacy Hub, support.google.com/gemini/answer/13594961. Admin search via Vault and the 18-month default history are on the same Education page. Google says the tools \"support compliance\" with FERPA and COPPA, which is not the same as \"compliant.\" Don't overstate it.", "9": "CLOCK 0:17\nSAY: Two minutes to make sure everything is switched on before you need it.\nWATCH FOR THREE PROBLEMS:\n1. notebook.google.com shows an error or \"not available\": the district has Gemini Notebook turned off for teachers. They can still do Modules 1 and 2. Pair them with a neighbor for 3 and 4, and note it for the district contact.\n2. No \"Upload files\" in Gemini's Add files menu: almost certainly the account is not marked 18 or over in the district's admin console. Google's age table removes file upload for under-18 school accounts (admin help: turn the Gemini app on or off), and K-12 accounts not marked 18+ default to under 18 (admin help: control access to Google services by age). Everything in Module 1 works by pasting text. Gem Knowledge files may not work for them either. Module 3 uploads happen in Gemini Notebook. Google's list of what under-18 accounts lose there doesn't mention uploads, so they should work. If they fail, paste text as a source.\n3. Gemini won't load at all for a school account: the Gemini app is off for their group. Nothing to fix in the room. Pair them up.\nAFTER: jot down the slide numbers and problems for a one-line email to the district after the session. The fix for all three is on their side (Admin console, Generative AI settings and the age designation).", "10": "CLOCK 0:19\nSAY: Before I teach you anything, let's see what Gemini does with a plain request. This is your before picture. Keep this chat open; in two slides you'll put the full CRAFT prompt beside it.\nWATCH: people who try to \"improve\" the cold prompt. Ask them to paste it exactly as written. The comparison is the lesson.\nNOTE: \"New chat\" is Google's label (support.google.com/gemini/answer/13666746, where Temporary chat sits next to it). If a teacher can't find it, any fresh chat works.", "11": "CLOCK 0:21\nSAY: Your cold prompt left Gemini guessing. A good prompt answers the questions a new colleague would ask before helping you. CRAFT is how you remember them: Context, Role, Action, Format, Tone.\nSAY: Open \"Tell me more\" to see our newsletter prompt with each letter filled in. Next slide, you'll paste the whole thing and put it beside your cold result.\nSAY: You don't need all five every time. Two or three usually do it. Google's own tips for writing Gem instructions cover the same ground with four parts. Ours adds tone, because tone is what families notice first.\nFACT: Google's four parts are Persona, Task, Context, Format, and Google says you don't need all four (support.google.com/gemini/answer/15235603).\nCHANGED 2026-09-29, after the first test group: CRAFT used to be built one letter per slide (five slides). Now it's cold prompt, this slide, then the full prompt, which saves about three minutes and keeps the comparison in one place.", "12": "CLOCK 0:23\nSAY: Now the whole prompt. New chat, paste, then put it beside your cold result. Which one would you send?\nLISTEN FOR: the details, the length, the dinner question, the warmth. Then land the point: same Gemini the whole time. The difference is what you told it.\nSAY (follow-up): It's a first draft. Talk back to it like you would a colleague.\nWATCH: people pasting into their cold chat. A new chat keeps the comparison fair.", "13": "CLOCK 0:25 (quick wins run to about 0:40)\nSAY: Seven quick wins. Pick two or three that fit your week and skip the rest. They're all in the workbook.\nWATCH: people trying to do all seven. Gently redirect: two done well beats seven skimmed. Point fast finishers to slide 21 (the 30-second check), then on to Gems.\nTIP: each quick win in the list is a button that jumps to it. Every quick win ends with \"Try another one\" (the other six) and Done (to slide 21), so nobody has to come back here.", "14": "QUICK WIN: differentiation.\nWATCH: the facts drifting between versions. The easier version sometimes drops a stage of the life cycle, and the harder version sometimes adds facts that aren't in the passage. Both are good catches for the 30-second check.\nNOTE: the passage is the same one in the Grade 3 sample unit (the Slide-44 files on slide 40), so teachers who use it now will recognize it in Module 3.", "15": "QUICK WIN: \"I can\" statements.\nWATCH: statements that say \"I can understand...\" That's not observable. The good ones name something a kid could show you.\nNOTE: the standards are the sample standards from the Grade 3 unit, written for this training. Teachers can paste their own state standards instead.", "16": "QUICK WIN: exit tickets.\nSAY: Take the quiz yourself before you use it. AI answer keys are wrong more often than you'd think.\nWATCH: silly wrong answers in the multiple choice (\"A seed needs pizza\"). Good distractors are believable.", "17": "QUICK WIN: sub plan.\nSAY (the red box): This is where people are most tempted to type names. Who has the allergy, who can't sit next to whom. Don't. That goes on the printed copy, by hand.\nTIP: the Sub Plan Builder Gem (slide 34) does this in the teacher's own format every time.", "18": "QUICK WIN: hands-on science.\nSAY: You're the scientist in the room. Gemini sounds equally sure when it's right and when it's wrong. Check the science and the safety.\nWATCH: activities that need heat, sharp tools, or anything a 3rd grader shouldn't handle, and \"experiments\" whose outcome is scientifically wrong.", "19": "QUICK WIN: directions for English learners.\nSAY: Clear directions help everyone. For multilingual learners, they're the difference between starting and waiting.\nSAY (translation): Translation is a draft too. Have a fluent colleague or family liaison check anything that goes home.\nWATCH: the rewrite quietly dropping a requirement. The original asks for partner talk, a journal entry, and two complete sentences. All three should survive.", "20": "QUICK WIN: vocabulary.\nWATCH: definitions that use harder words than the word they define (\"germinate: to commence development\"). And check pollination closely; it's the word AI most often explains loosely for kids.\nTIP: this is a good one to teach Export to Docs on (slide 21).", "21": "CLOCK 0:40 to 0:43\nSAY: AI output can be wrong, and it sounds exactly as sure when it is. Thirty seconds, four checks, every time something is headed to students or families.\nSAY: AI should make people more capable, not less responsible. Gemini drafts. You decide.\nROOM CHECK: by 0:43 most people should be here or moving into Module 2. Stragglers can come back to the quick wins later; they're all in the workbook.\nFACT: Google's help says \"Share & export\" then \"Export to Docs\" (support.google.com/gemini/answer/14184041). SEEN WHILE CAPTURING (personal account, 2026-09-27): there was no \"Share & export\" label; Export to Docs is in the menu under the three dots at the end of the row of buttons under a response. The slide follows the screen.", "22": "CLOCK 0:43 (Module 2 runs to about 1:13, then the break)\nSAY: Use a Gem when you want Gemini to act a certain way, every time, without retyping your instructions. Think of it as a colleague who already knows how you like things done.\nPLAN: build the Parent Note Drafter together (about 15 minutes), then everyone builds the Lesson Plan Co-Planner (about 10), then sharing (about 3). The other six library Gems are for fast finishers and the workbook.\nFACT: Gems are in every Workspace for Education edition at no cost; Google's 2025 launch post says there was no separate on/off control for Gems at launch (admins can turn off Gem sharing). They are NOT available in the Gemini mobile app for Workspace accounts, so everyone should be on a laptop for this module.", "23": "CLOCK 0:45\nSAY: The test is repetition. If you'll write it dozens of times this year with the same rules, it's a Gem. If it's a one-time question, just ask.\nASK THE ROOM: What do you write every week that should always sound the same? (Parent emails, sub plans, and rubrics come up every time.)", "24": "CLOCK 0:46\nSAY: We'll all build the same Gem so we can troubleshoot together. Use the direct link. It skips the menu, which Google keeps renaming.\nUNVERIFIED MENU NAME (checked 2026-09-24): Google's own pages use three names for the sidebar entry: \"Gems\", \"Explore Gems\", and \"Gem manager\". The direct link gemini.google.com/gems/create opened the editor when checked. SEEN WHILE CAPTURING (personal account, 2026-09-27): the menu item is \"Gems\", the page it opens is titled \"Gem manager\", and \"+ New Gem\" sits to the right of \"My Gems\" further down. Field labels \"Name\" and \"Description\" were seen on Google's live editor page (signed out, consumer view).\nWATCH: anyone who lands on a Gems list instead of the editor. They should look for New Gem.", "25": "CLOCK 0:49\nSAY: The Instructions box is the Gem's standing orders. Copy these, paste them in. Read the privacy lines out loud with me: they're the part that protects kids when you're tired and in a hurry.\nSAY (magic wand): Google's rewrite button is fine to try later on your own Gems. Read what it changed before you keep it. Today, keep ours as written, because we're about to test the privacy lines.\nFACT: the rewrite button's tooltip is \"Use Gemini to re-write instructions\" (blog.google Gems tips). No character limit on instructions is published.", "26": "CLOCK 0:52\nSAY: Leave the default tool alone for this one. Skip Knowledge for now; in Module 3 you'll attach a whole notebook to a Gem.\nSAY (red box): Google shows this warning right in the editor: if you share a Gem, the titles of its attached files are visible. Name every file as if your principal will read the name.\nFACTS: \"Default tool\" with \"No default tool\" and \"Canvas\" options, and the file-title warning, were seen on Google's live editor (signed out, 2026-09-24). Knowledge: \"Add files\", then \"Upload files\" or \"Add from Drive\"; up to 10 files (support.google.com/gemini/answer/15146780 and Classroom help 16534159). Drive files stay current when edited.\nUNVERIFIED: whether a teacher account not marked 18+ can upload Knowledge files. Google restricts file upload for under-18 school accounts, so it's likely blocked for them.\nSAY (Save): Save now, before you test. Your Gem has to be saved before you can try it on the next slide.\nTEST GROUP (2026-09-28): teachers couldn't test the Gem until they had saved it, so Save moved here from Part 4.\nFACTS: the save button is \"Save\" for a new Gem, beside \"Gem not saved\". Editing a saved Gem ends with \"Update\" (seen while capturing, 2026-09-27). \"Using the preview window does not automatically save your Gem\" (support.google.com/gemini/answer/15146780).", "27": "CLOCK 0:55\nSAY: The test message has a trap in it on purpose: a note about one family. A good Gem keeps the class message general and suggests a separate private note. If yours didn't, strengthen that line and test again. Testing your guardrails is part of building.\nSAY: You saved on the last slide. If you change the instructions now, select Update, or the change won't stick.\nFACTS: the \"Preview\" panel is from support.google.com/gemini/answer/15146780. Once a Gem is saved, the button says \"Update\" (seen while capturing, 2026-09-27); Google's pages also mention \"Save\" and \"Submit\" for edits.", "28": "CLOCK 1:00\nGEM: Lesson Plan Co-Planner. Everyone builds this one (since 2026-09-29): on slide 45 they attach their unit notebook to it, so nobody can skip it.\nSAY: Second Gem, same steps: Name, Description, Instructions, Save. In Module 3 you'll give this one your whole unit.\nSAY: This one asks before it guesses. If it asks you a question, that's the Gem working.\nWATCH: people attaching files under Knowledge now. Skip it today; the notebook does that job in Module 3.", "29": "CLOCK about 1:08, only if there's time\nSAY: Fast finishers: pick one more Gem that would have saved you time last month, and build it the same way. Everyone else, go on to sharing. All six are in the workbook.\nWATCH: people building three at once. One working Gem beats three half-built ones.\nTIP: each Gem in the list is a button that jumps to it. Every Gem slide ends with \"Try another one\" (the other five) and Done (to slide 36, sharing), so nobody has to come back here.\nFACT: \"No default tool\", \"Create image\", and \"Canvas\" were seen on Google's live editor, signed out. The list on an Education account is unverified, so the slide gives a fallback if Canvas isn't offered.", "30": "GEM: Differentiation Helper.\nSAY: Notice the labels: Version A, B, and C. Never \"low\" and \"high.\" Kids read labels.\nWATCH: \"more challenge\" versions that are just more work. The instructions say deeper thinking, not more problems.", "31": "GEM: Rubric Builder.\nSAY: The student-friendly version at the end is the part kids use. Post it with the assignment.\nWATCH: vague level descriptions (\"good use of details\"). The instructions ask for observable language; push back with a follow-up if it slips.", "32": "GEM: Read-Aloud Discussion Questions.\nSAY: Give it the title, author, grade, and a short summary in your own words. Don't upload a copyrighted book. The instructions tell it to ask when it doesn't know a book, instead of making up plot details, which is the failure you most want to avoid.\nNOTE: the sample prompt uses the Grade 6 story from the sample unit, so it works for everyone.", "33": "GEM: Accommodation Idea Brainstormer.\nSAY (the red box, slowly): Describe the need, never the child. Not even here. Especially here. And this Gem only brainstorms. Accommodations in an IEP or 504 plan are decided by the student's team, and the Gem says so at the end of every answer.\nWATCH: anyone who wants to attach a plan or an evaluation \"just to make it better.\" That's the one hard no of the day.", "34": "GEM: Sub Plan Builder.\nSAY: Paste your rough notes; get the same clear format every time. Anything private gets an [add by hand] marker so you write it on the printed copy.\nTIE-IN: pairs with quick win 4 on slide 17.", "35": "GEM: Classroom Management Script Helper.\nSAY: Short, calm, dignified. Kids under stress don't hear long speeches.\nSAY (the safety line): Anything involving a fight, a weapon, self-harm, a threat, or possible abuse goes straight to your school's procedures. The Gem is told to point you to an administrator or counselor instead of writing a script. That's the right answer.", "36": "CLOCK 1:10\nSAY: A good Gem is worth sharing with your grade-level team. Before you do, remember what travels with it: your instructions, your uploaded files, and the titles of any attached files.\nFACTS (support.google.com/gemini/answer/16504957): Share, then Viewer or Editor; Copy link; sharing follows the district's Drive sharing settings; \"Public\" and \"Anyone with the link\" may be missing for school accounts; notebook-sourced Gems can't be shared; people you share with need access to the Drive files for the Gem to use them. District admins can turn Gem sharing off, so a missing Share button is usually a district setting.\nSEEN WHILE CAPTURING (personal account, 2026-09-27): Share first asked to connect Google Workspace before the sharing window opened. The slide tells teachers who see that to stop and use their school's sharing process.\nSHARE THE PARENT NOTE DRAFTER: the Co-Planner gets a notebook in Module 3, and a Gem that uses a notebook can't be shared.\nSCREENSHOT CAUTION: the sharing window on a personal account can show \"Public\" and \"Anyone with the link\" options that school accounts may not have. Crop to the Viewer and Editor choices.", "37": "CLOCK 1:13 to 1:23\nSAY: Ten minutes. Stand up, refill, look at something farther away than a screen. If you're behind, finish your first Gem and keep going; the whole library is in the workbook.\nDURING THE BREAK: walk the room. Anyone who hit the access problems on slide 9? Make sure they have a partner for Modules 3 and 4.", "38": "CLOCK 1:23 (Module 3 runs to about 1:48)\nSAY: Use a notebook when you want Gemini to know a certain set of documents. It builds answers from your sources and cites them, so you can check them. That's what makes it a good fit for your own materials.\nSAY: You'll see \"NotebookLM\" here and there. Google renamed it Gemini Notebook on July 16, 2026, and the new name is still rolling out across screens and help pages.\nFACTS: rename date and notebook.google.com (blog.google, Workspace Updates 2026-07-16). notebooklm.google.com redirects to the new address.", "39": "CLOCK 1:25\nSAY the one line: A Gem changes how Gemini acts. A notebook changes what Gemini knows.\nFACTS: 50 sources per notebook is the published limit for Education Fundamentals and Standard (support.google.com/gemininotebook/answer/16337734). Gem Knowledge takes up to 10 files.", "40": "CLOCK 1:26\nSAY: Your own unit is the best choice. If you're using ours, pick one unit and download all four files for it.\nWATCH: teachers about to upload a gradebook export or student work samples. Stop them kindly. Sources should be curriculum, not student records.\nFILES: the eight sample files start with \"Slide-44\". That's a fixed name kept from an earlier version of the deck so the screenshots still match; it isn't this slide's number.\nFACT: supported sources include Google Docs, Google Slides, PDF, .docx, .pptx, and more (support.google.com/gemininotebook/answer/16215270). Standard accounts get 50 sources per notebook.", "41": "CLOCK 1:29\nSAY: Three labels for the same button, because Google's own help pages use all three. Look for the words, not the position.\nUNVERIFIED (checked 2026-09-24): Google is rolling out \"a fresh new look\" for Gemini Notebook (announced Sept 15, 2026), so layout may differ from the help pages. The label of the Google Drive option in the add-sources window and how to rename a notebook are not documented, so the slide describes them without naming a button. Drive import of PDF and .docx (as opposed to Google Docs and Slides) is also not confirmed; uploading from the computer is the safe path.\nWATCH: uploads that seem stuck. Large files take a moment. Our sample PDFs are one or two pages each.\nFACTS: \"Create new notebook\" and \"Upload a source\" (support.google.com/gemininotebook/answer/16206563); \"Add sources\" and \"+ Add\" (answer/16215270). Drive sources sync with Drive.\nSEEN WHILE CAPTURING (personal account, 2026-09-27): \"+ New notebook\", then a window with \"Upload files\", \"Websites\", \"Books\", \"Drive\", and \"Copied text\". The slide follows the screen.\nTEST GROUP (2026-09-28): people who had the whole .zip didn't know which files to pick, and nobody knew the notebook saves itself. SEEN WHILE CAPTURING (personal account, 2026-09-29): after the upload, the notebook named itself from its sources (\"From Seed to Seed: The Life of a Bean Plant\"), with \"4 sources\" under the title. There is no Save button.\nSAY: One unit, four files. Not all eight.\nSINCE 2026-09-30: the deck no longer offers a .zip. Each unit's files download on slide 40.\nSAY (at the end): No Save button. It saves on its own, so it's ready for your first question.", "42": "CLOCK 1:33\nSAY: This is the habit to keep from today: when an answer is important, check where it came from. Hover a citation to see the quote. Select it to jump to the spot in your source.\nWATCH: people reading the answer and skipping the citations. Walk over and ask, \"Show me where it got that.\"\nFACT: hover to see the quote, select to jump to it (support.google.com/gemininotebook/answer/16179559).", "43": "CLOCK 1:37\nSAY: Watch what it does. I'm not going to promise you what happens, because it varies. That's the point: in a notebook, you can always tell whether an answer came from your documents. No citation means it didn't.\nCONFIGURE CHAT: labels \"Configure Chat\", \"Default\", \"Learning Guide\", \"Custom\", \"Save\" are from support.google.com/gemininotebook/answer/16179559. The names of the response-length options are not documented. SEEN WHILE CAPTURING (personal account, 2026-09-27): the menu is under the three dots at the top right, and the lengths are Default, Longer, and Shorter.", "44": "CLOCK 1:39\nFACTS: \"Save to note\" keeps tables and citations; saved response notes can't be edited (support.google.com/gemininotebook/answer/16262519). Notebook sharing: \"Share\", \"Viewer\" or \"Editor\", \"Copy link\" (answer/16206563). Google's help says public notebook sharing is \"currently disabled\" for Education accounts, although an admin page shows a public option, so the slide just says families get downloads instead.\nSCREENSHOT CAUTION: a personal account's sharing window may offer public sharing that school accounts don't. Crop to adding a colleague.", "45": "CLOCK 1:41\nSAY: Here the two tools meet: a Gem that acts the way you want and knows your unit.\nUNVERIFIED (checked 2026-09-24): how to open an existing Gem for editing is not labeled in Google's help (SEEN WHILE CAPTURING (personal account, 2026-09-27): a pencil icon on the Gem's row under My Gems; the slide says so) (it describes making edits, then Save, Update, or Submit, depending on the page; SEEN WHILE CAPTURING (personal account, 2026-09-27): editing an existing Gem ends with \"Update\" beside \"Gem not saved\"). \"More uploads\" then \"Notebooks\" is verified, but Google's help still calls it \"a NotebookLM notebook\", so the menu may say NotebookLM. SEEN WHILE CAPTURING (personal account, 2026-09-27): the Knowledge add-files button offers \"Gemini Notebook\" directly. The slide names that first and mentions the help page's More uploads path as the other version. School screens may differ.\nSAY: Switch back to your Gemini tab. The Gem lives in Gemini, not in the notebook.\nTEST GROUP (2026-09-28): step 1 used to start in Gemini's menu while everyone was still in the notebook tab, so a first step now sends them back to Gemini.\nWATCH: people trying to share this Gem afterward. It won't allow it: \"NotebookLM notebooks can't be used as a source for shared Gems\" (support.google.com/gemini/answer/16504957). To share, attach files instead.", "46": "CLOCK 1:45\nSAY: Some of you will see Notebooks in the Gemini app's menu, and some won't yet. It started reaching school accounts in mid-September. Your own notebooks, kept in sync (ones shared with you don't appear), but the Studio items in Module 4 only happen at notebook.google.com.\nFACTS: Notebooks in Gemini for Workspace, including schools, rolling out from Sept 14, 2026, up to 15 days, \"New notebook\" (Workspace Updates, 2026-09-17). Studio items can't be generated from the Gemini app (support.google.com/gemininotebook/answer/17003757). CONFLICT: the Gemini help page still says the feature isn't available for school accounts, and the two pages give different source limits, so the slide avoids numbers.", "47": "CLOCK 1:48 (Module 4 runs to about 2:18)\nSAY: Start the Audio Overview first, because it takes a few minutes. Then work through the others while it cooks.\nSAY (limits): Plan for the lowest limits. Google's published limits for Education Fundamentals and Standard: 3 Audio Overviews a day, and 10 each of reports, flashcards, quizzes, and mind maps. Slide decks are listed as limited. Make each one count.\nCONFLICT (checked 2026-09-24): a Google usage page says limits became \"compute-based\" on Sept 2, 2026 (refreshing every 5 hours up to a weekly cap), while the Education tables still show per-day numbers. Either way, one of each per teacher is safe.\nFACTS: Studio list (support.google.com/gemininotebook/answer/16206563); Education limits (answer/16337734); \"Settings\" then \"Usage\" (answer/17670842). Google's help says a pencil icon opens an item's options first (answer/16206563). SEEN WHILE CAPTURING (personal account, 2026-09-27): selecting a Studio tile opens its options, and not every tile shows a pencil, so the slides say to select the tile.", "48": "CLOCK 1:50\nSAY: Brief is one voice, under two minutes, which is right for families on a busy night.\nSAY: Listen to the whole thing before anyone else does. Then download it and share it the way your district approves. Google's help says public notebook sharing is off for school accounts.\nFACTS (support.google.com/gemininotebook/answer/16212820): formats \"Deep Dive\" (default), \"The Brief\", \"The Critique\", \"The Debate\"; lengths \"Shorter\", \"Default\", \"Longer\" (English only); a focus prompt; \"Download\". SEEN WHILE CAPTURING (personal account, 2026-09-27): the window is \"Customize Audio Overview\"; formats read \"Deep Dive\", \"Brief\", \"Critique\", \"Debate\"; lengths \"Short\", \"Default\", \"Long\" (Deep Dive only; Brief shows no Length); the box asks \"What should the AI hosts focus on in this episode?\"; Download is in the menu next to a finished audio. SEEN (2026-09-30): while it works, Studio shows \"Generating Audio Overview...\" and \"Come back in a few minutes\" under the tiles. The finished audio shows its name with a Play button and three dots. Play opens the player at the bottom of Studio, and the player has three dots too. Either set opens the menu with Download, and the menu opens between them. The slide follows the screen. The name of the button that starts generation and the downloaded file type are not documented, so the slide doesn't name them.\nAGE NOTE: Audio Overviews in Gemini Notebook are available to all ages; only the Interactive mode is 18+.", "49": "CLOCK 1:55\nUNVERIFIED (checked 2026-09-24): Google's create-notebook help page lists \"FAQ, study guide, briefing document\" as Document report types, but the newer Reports help page doesn't name the templates. The slide covers the case where \"Study guide\" isn't listed.\nFACTS: \"Reports\" then \"Document\", and \"Export to Docs\" (support.google.com/gemininotebook/answer/18323649).\nUNVERIFIED: Google's pages don't show a box for typing instructions into a report. The slide gives a fallback: generate it as is, or use the chat and copy the answer into a Doc. SEEN WHILE CAPTURING (personal account, 2026-09-27): \"Create report\", Format \"Interactive\" or \"Document\", Template \"Create Your Own\", \"Briefing Doc\", \"Study Guide\", \"Blog Post\" (pencils on the last three), then \"Generate later\" or \"Generate now\". Export to Docs is in the report's menu.\nWATCH: adult reading level. Study guides drift up. A follow-up prompt fixes it fast.", "50": "CLOCK 2:00\nSAY: Studio quizzes are practice inside the notebook. There's no download for them. For something students can take, ask the chat, and it will cite the sources for each question.\nFACTS (support.google.com/gemininotebook/answer/16958963): difficulty easy, medium, hard; number fewer, standard, more; a prompt. No quiz download is documented. Google announced more quiz formats in September 2026, and its pages disagree on which have shipped, so the slide doesn't list them.", "51": "CLOCK 2:05\nFACTS (support.google.com/gemininotebook/answer/16958963): same difficulty and number options as quizzes; flashcards download as a CSV file.\nTIP: a CSV opens in Google Sheets (upload it to Drive, then open it). From there teachers can print or cut paper cards.", "52": "CLOCK 2:08\nSAY: A mind map is a one-page picture of how the ideas connect. Project it on day one as a preview, or use it for review.\nFACTS (support.google.com/gemininotebook/answer/16212283): \"In the chat, select the Mind Map chip\"; it's saved in Studio; it can be downloaded. The downloaded file type is not documented. SEEN WHILE CAPTURING (personal account, 2026-09-27): Mind Map is a Studio tile; the chip may also appear near the chat.", "53": "CLOCK 2:11\nSAY: Download as PowerPoint to edit it in Google Slides.\nAGE GATE (the big one): Slide Decks are 18+ only on school accounts (admin help: turn Gemini Notebook on or off, updated 2026-09-23). A teacher account not marked 18+ in the district's admin console may not see Slide Deck. It's a district setting. Fallback on the slide: ask the chat for an outline and build it in Google Slides.\nFACTS (support.google.com/gemininotebook/answer/16757456): \"Detailed Deck\", \"Presenter Slides\"; length short, default, long; a prompt; \"Download PDF Document (.pdf)\" and \"Download PowerPoint (.pptx)\"; \"Revise\".", "54": "CLOCK 2:15 to 2:18\nSAY: You just made a lot, fast. Speed is the easy part. The last step is always yours. The goal is to check it quickly and well.", "55": "CLOCK 2:18\nSAY: Look back at what you made. Two and a half hours ago some of you had never written a prompt. And the part that will outlast any one tool: you know how to check what it gives you.\nASK THE ROOM (if there's time): Which one thing will you use tomorrow?", "56": "CLOCK 2:22\nSAY: One small thing a day. Each one takes fifteen minutes or less. Don't skip Friday: show a colleague. That's how this spreads in a building, one teacher at a time.", "57": "CLOCK 2:25 to 2:30\nSAY: Everything from today is in these files. The workbook has every prompt, every Gem, and every step, with the pictures. Download it now, before you close this tab.\nSAY: Questions later? Reach out through woodenboyindustriesai.com. I'd love to hear what you made.\nAFTER THE SESSION: if slide 9 turned up access problems, send the district contact one line naming them (Gemini app or Gemini Notebook off, or teacher accounts not marked 18 or over). The fix is in their Admin console."}};
  var pos = 1;
  var frame = document.getElementById('deck');
  function $(id) { return document.getElementById(id); }

  $('planTitle').textContent = PLAN.title;

  function send() {
    try { frame.contentWindow.postMessage({ type: 'wbi-goto', pos: pos }, '*'); } catch (e) {}
  }
  frame.addEventListener('load', send);

  // Moves made inside the deck (its arrows, a slide menu) report back here,
  // so the counter and notes follow.
  window.addEventListener('message', function (ev) {
    if (ev.source !== frame.contentWindow) return;
    var d = ev.data || {};
    if (d.type === 'wbi-ready') { send(); return; }
    if (d.type !== 'wbi-pos') return;
    var n = d.pos | 0;
    if (n < 1 || n > PLAN.slides || n === pos) return;
    pos = n; render(false);
  });

  function milestoneFor(n) {
    for (var i = 0; i < PLAN.milestones.length; i++) {
      var m = PLAN.milestones[i];
      if (n >= m.from && n <= m.to) return m.title;
    }
    return '';
  }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // CLOCK lines become a marker; SAY:, WATCH:, IF IT BREAKS: and the like go bold.
  function format(note) {
    return note.split('\n').map(function (line) {
      var t = esc(line);
      var clock = t.match(/^(CLOCK [0-9:]+(?: to [0-9:]+)?)(.*)$/);
      if (clock) return '<span class="clock">' + clock[1] + '</span>' + clock[2];
      if (/^[A-Z][A-Z ]{3,}$/.test(t)) return '<b>' + t + '</b>';
      return t.replace(/^([A-Z][A-Z ]+(?: \([^)]*\))?:)/, '<b>$1</b>');
    }).join('\n');
  }

  function render(push) {
    $('counter').textContent = pos + ' / ' + PLAN.slides;
    $('mstone').textContent = milestoneFor(pos);
    $('notesHead').textContent = 'Teaching notes · slide ' + pos;
    $('slideTitle').textContent = PLAN.titles[String(pos)] || '';
    var note = PLAN.notes[String(pos)];
    if (note) { $('notesBody').innerHTML = format(note); $('notesBody').className = 'body'; }
    else { $('notesBody').textContent = 'No notes for this slide.'; $('notesBody').className = 'body none'; }
    $('notes').scrollTop = 0;
    if (push !== false) send();
  }

  function go(delta) {
    var n = pos + delta;
    if (n < 1 || n > PLAN.slides) return;
    pos = n; render();
  }
  // A participant reads their slide number off their screen; type it, Enter.
  $('gotoForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = parseInt($('gotoInput').value, 10);
    if (!(n >= 1 && n <= PLAN.slides)) { $('gotoInput').select(); return; }
    pos = n; render();
    $('gotoInput').value = '';
    $('gotoInput').blur();
  });
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'g' || e.key === 'G') { e.preventDefault(); $('gotoInput').focus(); }
  });

  // facilitator.html#23 opens on slide 23.
  function fromHash() {
    var n = parseInt((location.hash || '').slice(1), 10);
    return n >= 1 && n <= PLAN.slides ? n : 0;
  }
  pos = fromHash() || 1;
  render();
  window.addEventListener('hashchange', function () {
    var n = fromHash();
    if (n && n !== pos) { pos = n; render(); }
  });

  // Drag the bar down for more slide, up for more notes. The height sticks
  // between visits in this browser.
  (function () {
    var bar = $('dragbar'), notes = $('notes');
    var saved = 0;
    try { saved = parseFloat(localStorage.getItem('wbi-notes-h') || ''); } catch (e) {}
    if (saved >= 48) notes.style.height = saved + 'px';
    bar.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      bar.setPointerCapture(e.pointerId);
      var startY = e.clientY;
      var startH = notes.getBoundingClientRect().height;
      document.body.classList.add('resizing');
      function move(ev) {
        var h = startH + (startY - ev.clientY);
        var max = window.innerHeight * 0.75;
        notes.style.height = Math.max(48, Math.min(max, h)) + 'px';
      }
      function up(ev) {
        bar.releasePointerCapture(ev.pointerId);
        bar.removeEventListener('pointermove', move);
        bar.removeEventListener('pointerup', up);
        document.body.classList.remove('resizing');
        try { localStorage.setItem('wbi-notes-h', String(Math.round(notes.getBoundingClientRect().height))); } catch (e) {}
      }
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
    });
  })();
})();
</script>
